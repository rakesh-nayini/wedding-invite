<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Asritha & Rakesh Reddy — A cinematic wedding invitation" />
    <meta name="theme-color" content="#FFF8F5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="%BASE_URL%assets/images/hero-1080.jpg" />
    <title>Asritha & Rakesh Reddy | Wedding Invitation</title>
  </head>
  <body>
    <audio
      id="invite-music"
      src="%BASE_URL%assets/audio/theme.mp3"
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    ></audio>
    <script>
      (function () {
        var audio = document.getElementById('invite-music')
        if (!audio) return
        window.__inviteMusicOff = false
        audio.muted = false
        audio.volume = 0
        audio.loop = true
        var target = 0.35
        var fadeMs = 2500
        var fading = false
        function fadeUp() {
          if (fading || window.__inviteMusicOff) return
          fading = true
          var from = audio.volume
          var start = performance.now()
          function tick(now) {
            if (window.__inviteMusicOff || audio.paused) {
              fading = false
              return
            }
            var t = Math.min(1, (now - start) / fadeMs)
            audio.volume = from + (target - from) * t
            if (t < 1) requestAnimationFrame(tick)
            else fading = false
          }
          requestAnimationFrame(tick)
        }
        function start() {
          if (window.__inviteMusicOff) return
          audio.muted = false
          var play = audio.play()
          if (play && play.then) {
            play.then(fadeUp).catch(function () {
              window.setTimeout(start, 350)
            })
          } else {
            fadeUp()
          }
        }
        audio.addEventListener('canplay', start)
        audio.addEventListener('loadeddata', start)
        start()
        window.setInterval(function () {
          if (!window.__inviteMusicOff && audio.paused) start()
        }, 600)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
